# RatchetHub's own CI: the full suite, on a machine with no consumer project (charter C1).
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the test runner (pinned)
        run: python3 -m pip install --user pytest==9.1.1
      - name: Run the suite
        run: python3 -m pytest -q
